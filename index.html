<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrasi Warga RT/RW</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px system-ui;margin:0;background:#f3f6f3;color:#17211b}header{background:#14532d;color:white;padding:18px}main{max-width:950px;margin:auto;padding:14px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:15px;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;margin:4px 0;border:1px solid #bbb;border-radius:8px;max-width:100%}input,select,textarea{width:100%;box-sizing:border-box}button{background:#166534;color:white;border:0}button.secondary{background:#e5eee7;color:#17351f}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#edf5ee;padding:12px;border-radius:8px;min-width:100px}.stat b{display:block;font-size:24px}.hidden{display:none}.table{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd;font-size:14px}.muted{color:#66736a;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>Registrasi Warga RT/RW</b><div class="muted" style="color:#e5eee7">Aplikasi online multi-HP</div></header><main>
<section id="login" class="card"><h3>Login Petugas</h3><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button id="loginBtn">Masuk</button><p id="loginMsg"></p></section>
<div id="app" class="hidden"><section class="card"><b id="who"></b> <button id="logout" class="secondary">Keluar</button></section><section class="card"><h3>Ringkasan</h3><div class="stats"><div class="stat"><b id="total">0</b>Total warga</div><div class="stat"><b id="male">0</b>Laki-laki</div><div class="stat"><b id="female">0</b>Perempuan</div><div class="stat"><b id="child">0</b>Usia 0–17</div></div><p id="age" class="muted"></p></section>
<section class="card"><h3 id="formTitle">Tambah warga</h3><input id="rid" type="hidden"><div class="grid"><label>NIK<input id="nik" maxlength="16" inputmode="numeric"></label><label>Nomor KK<input id="kk" maxlength="16" inputmode="numeric"></label><label>Nama lengkap<input id="nama"></label><label>Jenis kelamin<select id="jk"><option value="">Pilih</option><option>Laki-laki</option><option>Perempuan</option></select></label><label>Tempat lahir<input id="tempat"></label><label>Tanggal lahir<input id="lahir" type="date"></label><label>Agama<input id="agama"></label><label>Status perkawinan<select id="status"><option value="">Pilih</option><option>Belum kawin</option><option>Kawin</option><option>Cerai hidup</option><option>Cerai mati</option></select></label><label>Pendidikan<input id="pendidikan"></label><label>Pekerjaan<input id="pekerjaan"></label><label>Hubungan keluarga<input id="hubungan"></label><label>Foto KTP/KK<input id="foto" type="file" accept="image/*" capture="environment"></label></div><label>Alamat<textarea id="alamat"></textarea></label><button id="save">Simpan warga</button><button id="clear" class="secondary">Kosongkan</button><p id="formMsg" class="muted"></p></section>
<section class="card"><h3>Daftar warga</h3><input id="search" placeholder="Cari nama, NIK, atau KK"><button id="csv" class="secondary">Ekspor CSV</button><button id="backup" class="secondary">Backup JSON</button><div class="table"><table><thead><tr><th>Nama / NIK</th><th>JK</th><th>Umur</th><th>KK</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><p class="muted">Data NIK dan foto adalah data pribadi. Gunakan hanya setelah kebijakan akses diuji. Jangan bagikan akun petugas.</p></main>
<script>
const URL='https://qnwjyvunsuizxjccmfzd.supabase.co', KEY='sb_publishable_vsCXxYSFcXL_dGt1JzuwKA_qA3nW6ap', BUCKET='foto-warga';
const db=supabase.createClient(URL,KEY);let data=[],user=null;const $=x=>document.getElementById(x);const say=(id,t)=>$(id).textContent=t;
function age(d){if(!d)return null;let b=new Date(d+'T00:00:00'),n=new Date(),a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()==b.getMonth()&&n.getDate()<b.getDate()))a--;return a}
async function start(){let {data:{session}}=await db.auth.getSession();if(session){user=session.user;await enter()
async function enter(){let {data:p,error}=await db.from('petugas'$('loginBtn').onclick=async()=>{
  try {
    say('loginMsg','Sedang menghubungkan...');
    const email=$('email').value.trim();
    const password=$('pass').value;

    if(!email || !password){
      say('loginMsg','Email dan password wajib diisi.');
      return;
    }

    const {data:d,error}=await db.auth.signInWithPassword({
      email,
      password
    });

    if(error){
      say('loginMsg','Login gagal: '+error.message);
      return;
    }

    user=d.user;
    await enter();

  } catch(e) {
    say('loginMsg','Kesalahan koneksi: '+e.message);
  }
};).select('nama,peran').eq('user_id',user.id).maybeSingle();if(error||!p){await db.auth.signOut();say('loginMsg','Akun belum terdaftar sebagai petugas.');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');say('who',(p.nama||user.email)+' — '+p.peran);await load()}
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};async function load(){let {data:d,error}=await db.from('warga').select('*').order('nama_lengkap');if(error){say('formMsg',error.message);return}data=d||[];render()}
function render(){let q=$('search').value.toLowerCase(),list=data.filter(r=>[r.nama_lengkap,r.nik,r.nomor_kk].some(x=>String(x||'').toLowerCase().includes(q)));$('rows').innerHTML=list.map(r=>`<tr><td>${esc(r.nama_lengkap)}<br><small>${esc(r.nik)}</small></td><td>${esc(r.jenis_kelamin||'-')}</td><td>${age(r.tanggal_lahir)??'-'}</td><td>${esc(r.nomor_kk||'-')}</td><td><button class="secondary" onclick="edit('${r.id}')">Edit</button><button onclick="del('${r.id}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan="5">Belum ada data</td></tr>';let ages=data.map(r=>age(r.tanggal_lahir)).filter(x=>x!==null);$('total').textContent=data.length;$('male').textContent=data.filter(r=>r.jenis_kelamin==='Laki-laki').length;$('female').textContent=data.filter(r=>r.jenis_kelamin==='Perempuan').length;$('child').textContent=ages.filter(x=>x<=17).length;$('age').textContent=`Usia 18–59: ${ages.filter(x=>x>=18&&x<=59).length} | 60+: ${ages.filter(x=>x>=60).length}`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function payload(){return {nik:$('nik').value.trim(),nomor_kk:$('kk').value.trim()||null,nama_lengkap:$('nama').value.trim(),jenis_kelamin:$('jk').value||null,tempat_lahir:$('tempat').value||null,tanggal_lahir:$('lahir').value||null,agama:$('agama').value||null,status_perkawinan:$('status').value||null,pendidikan:$('pendidikan').value||null,pekerjaan:$('pekerjaan').value||null,hubungan_keluarga:$('hubungan').value||null,alamat:$('alamat').value||null,updated_at:new Date().toISOString()}}
$('save').onclick=async()=>{let d=payload(),id=$('rid').value;if(!/^\d{16}$/.test(d.nik)||!d.nama_lengkap){say('formMsg','NIK wajib 16 angka dan nama wajib diisi.');return}let f=$('foto').files[0];if(f){let ext=f.name.split('.').pop().replace(/[^a-z0-9]/gi,'');let path=user.id+'/'+crypto.randomUUID()+'.'+ext;let up=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type});if(up.error){say('formMsg','Foto gagal diunggah: '+up.error.message+' Pastikan bucket foto-warga sudah dibuat.');return}d.foto_url=path}let res=id?await db.from('warga').update(d).eq('id',id):await db.from('warga').insert(d);if(res.error){say('formMsg',res.error.message);return}say('formMsg','Data berhasil disimpan.');clearForm();await load()};
function clearForm(){['rid','nik','kk','nama','jk','tempat','lahir','agama','status','pendidikan','pekerjaan','hubungan','alamat','foto'].forEach(x=>$(x).value='');$('formTitle').textContent='Tambah warga'}$('clear').onclick=clearForm;
window.edit=id=>{let r=data.find(x=>x.id===id);$('rid').value=r.id;$('nik').value=r.nik;$('kk').value=r.nomor_kk||'';$('nama').value=r.nama_lengkap;$('jk').value=r.jenis_kelamin||'';$('tempat').value=r.tempat_lahir||'';$('lahir').value=r.tanggal_lahir||'';$('agama').value=r.agama||'';$('status').value=r.status_perkawinan||'';$('pendidikan').value=r.pendidikan||'';$('pekerjaan').value=r.pekerjaan||'';$('hubungan').value=r.hubungan_keluarga||'';$('alamat').value=r.alamat||'';$('formTitle').textContent='Edit warga';window.scrollTo(0,0)};window.del=async id=>{if(confirm('Hapus data warga?')){let {error}=await db.from('warga').delete().eq('id',id);if(error)alert(error.message);else load()}};
$('search').oninput=render;$('csv').onclick=()=>{let c=['nik','nomor_kk','nama_lengkap','jenis_kelamin','tempat_lahir','tanggal_lahir','agama','status_perkawinan','pendidikan','pekerjaan','hubungan_keluarga','alamat'];let s=[c.join(','),...data.map(r=>c.map(k=>'"'+String(r[k]||'').replace(/"/g,'""')+'"').join(','))].join('\n');download('data-warga.csv',s,'text/csv')};$('backup').onclick=()=>download('backup-warga.json',JSON.stringify({warga:data},null,2),'application/json');function download(n,s,t){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:t}));a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}start();
</script></body></html>
